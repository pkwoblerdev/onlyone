
# Посредник удалённого управления onlyone (WebSocket). Длиннее префикс /1code/, поэтому выигрывает у раздачи файлов.
# Пакеты зашифрованы ключом устройства и здесь не читаются и не пишутся в журнал.
location ^~ /1code/relay {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log off;
}
location = /1code/relay-health {
    proxy_pass http://127.0.0.1:8788/health;
    access_log off;
}
